{% extends "base.html" %}
{% block body %}
<h1>Anmeldung bestätigen</h1>
<p class="lede" id="lede">Ein Klick noch, dann bist du angemeldet.</p>
<form method="post" action="/confirm" id="form">
  <input type="hidden" name="token" id="token" value="">
  <button type="submit">Jetzt bestätigen</button>
</form>
<p class="hint error" id="no-token" hidden>Diesem Link fehlt der Bestätigungscode. Öffne ihn
noch einmal direkt aus der Nachricht.</p>
<script nonce="{{ request.state.csp_nonce }}">
(function () {
  // The token rides in the fragment (D-26). A fragment is never sent to the server, so unlike
  // a query parameter it cannot reach a request log, a proxy's history or a `Referer` header.
  // This is the only way the field is filled: the server does not read a token from the query,
  // so the old shape is gone rather than deprecated.
  var field = document.getElementById('token');
  var hash = window.location.hash || '';
  // `#a=` arrives from a push notification and confirms on open; `#t=` arrives by mail and waits
  // for the click. Which one is sent is decided in the message, where the channel is known.
  var auto = hash.indexOf('#a=') === 0;
  if (auto || hash.indexOf('#t=') === 0) {
    field.value = decodeURIComponent(hash.slice(3));
    // Erased, and replaceState so Back does not return to a URL still carrying the token.
    history.replaceState(null, '', window.location.pathname);
  }
  if (field.value && auto) {
    // The form is left on screen rather than hidden: if this submit does not fire for any
    // reason, the button behind it is still the working way through.
    document.getElementById('lede').textContent =
      'Einen Moment – wir bestätigen deine Anmeldung …';
    document.getElementById('form').submit();
    return;
  }
  if (!field.value) {
    document.getElementById('form').hidden = true;
    // The lede promises the very thing this state cannot deliver ("ein Klick noch"), so it goes
    // with the button rather than sitting above the explanation contradicting it.
    document.getElementById('lede').hidden = true;
    document.getElementById('no-token').hidden = false;
  }
})();
</script>
{% endblock %}
