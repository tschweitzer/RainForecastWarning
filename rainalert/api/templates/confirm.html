{% extends "base.html" %}
{% block body %}
<h1>Anmeldung bestätigen</h1>
<p class="lede">Ein Klick noch, dann bist du angemeldet.</p>
<form method="post" action="/confirm" id="form">
  <input type="hidden" name="token" id="token" value="{{ token }}">
  <button type="submit">Jetzt bestätigen</button>
</form>
<p class="hint error" id="no-token" hidden>Diesem Link fehlt der Bestätigungscode. Öffne ihn
noch einmal direkt aus der Nachricht.</p>
<script nonce="{{ request.state.csp_nonce }}">
(function () {
  // The token rides in the fragment (D-26). A fragment is never sent to the server, so unlike
  // `?token=` it cannot reach a request log, a proxy's history or a `Referer` header. The
  // server-rendered value stays as the fallback so links sent before this change still work;
  // nothing generates that shape any more.
  var field = document.getElementById('token');
  var hash = window.location.hash || '';
  if (hash.indexOf('#t=') === 0) {
    field.value = decodeURIComponent(hash.slice(3));
    // Erased, and replaceState so Back does not return to a URL still carrying the token.
    history.replaceState(null, '', window.location.pathname);
  }
  if (!field.value) {
    document.getElementById('form').hidden = true;
    document.getElementById('no-token').hidden = false;
  }
})();
</script>
{% endblock %}
