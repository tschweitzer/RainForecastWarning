<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Regenwarnung{% endblock %}</title>
<style>
  :root { --fg:#16202c; --bg:#fbfcfd; --muted:#5b6b7c; --line:#d8e0e8; --accent:#1f6fb2; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e6edf3; --bg:#11161c; --muted:#93a3b4; --line:#2a333d; --accent:#6cb6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 16px; background:var(--bg); color:var(--fg);
         font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 2rem 0 3rem; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  p.lede { color:var(--muted); margin-top:0; }
  label { display:block; margin:1rem 0 .25rem; font-weight:600; }
  input[type=text],input[type=email],input[type=number] {
    width:100%; padding:.6rem .7rem; font-size:1rem; border:1px solid var(--line);
    border-radius:8px; background:var(--bg); color:var(--fg); }
  .row { display:flex; gap:.75rem; } .row > div { flex:1; }
  button { margin-top:1.25rem; padding:.7rem 1.1rem; font-size:1rem; font-weight:600;
           border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .consent { display:flex; gap:.6rem; align-items:flex-start; margin-top:1.25rem;
             font-size:.92rem; color:var(--muted); }
  .consent input { margin-top:.25rem; }
  code { background:rgba(127,127,127,.14); padding:.15rem .35rem; border-radius:4px;
         word-break:break-all; font-size:.92rem; }
  footer { margin-top:2.5rem; padding-top:1rem; border-top:1px solid var(--line);
           font-size:.82rem; color:var(--muted); }
  .note { border-left:3px solid var(--accent); padding:.6rem .9rem; margin:1.25rem 0;
          background:rgba(127,127,127,.07); font-size:.94rem; }
</style>
</head>
<body><main>
{% block body %}{% endblock %}
<footer>
  Datenbasis: Deutscher Wetterdienst (DWD), Radarprodukt RV,
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> ·
  <a href="/privacy">Datenschutz</a>
</footer>
</main></body>
</html>
