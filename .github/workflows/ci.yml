name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The ingest and subscription tests use advisory locks, unique constraints and array columns.
    # Running them against SQLite would prove nothing about production, so CI gets a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rainalert
          POSTGRES_PASSWORD: rainalert
          POSTGRES_DB: rainalert_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      # Deliberately the same target a developer runs, so "passes locally" and "passes in CI"
      # cannot come apart.
      - name: Lint
        run: make lint RUFF=ruff

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+psycopg://rainalert:rainalert@localhost:5432/rainalert_test
          # The suite skips the database tests when TEST_DATABASE_URL is unset, so a broken
          # service container would look like a green build. This makes that skip a failure.
          REQUIRE_DATABASE_TESTS: "1"
        run: make test PY=python

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t rainalert:ci .
      - name: Smoke-test both entrypoints
        run: |
          docker run --rm rainalert:ci python -m rainalert.cli --help
          docker run --rm rainalert:ci python -c "from rainalert.api.app import create_app; print('api importable')"
