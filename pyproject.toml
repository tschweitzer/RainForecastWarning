[project]
name = "rainalert"
version = "0.1.0"
description = "Warns about rain starting at your location, from DWD radar nowcast data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyproj>=3.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pydantic[email]>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "pillow>=10.0",
    # Web push (D-45). Deliberately not `pywebpush`, which is the usual choice: it brings both
    # `requests` and `aiohttp`, neither of which this project uses, and it owns the HTTP call - so
    # the injectable `httpx.BaseTransport` every other transport here is tested through would not
    # work. These two are the libraries pywebpush itself uses for the parts that are actually hard.
    #   py-vapid  - signs the RFC 8292 Authorization header
    #   http-ece  - RFC 8291 aes128gcm payload encryption
    # Both are single-maintainer PyPI "critical projects"; noted in DESIGN.md D-45 as a risk to
    # watch rather than a reason to hand the whole thing to a third dependency that wraps them.
    "py-vapid>=1.9",
    "http-ece>=1.2",
    # Imported directly by notify/webpush.py for the ephemeral P-256 keypair each message needs,
    # not only pulled in by the two above. Declared because it is imported: a transitive dependency
    # that a direct import relies on breaks the day the intermediate drops it.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "wradlib>=2.0",   # test-only oracle for the decoder and grid (D-21) - never imported at runtime
    # Pinned to a compatible release, not >=. The formatter's output changes between minor
    # versions, so an open range means CI can fail on code nobody touched - which is both
    # confusing and trains you to ignore lint failures.
    "ruff~=0.16.7",
]
# Production only; the local archive store needs no cloud SDK.
gcs = ["google-cloud-storage>=2.16"]

[project.scripts]
rainalert = "rainalert.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rainalert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: compares against wradlib, the reference implementation (D-21)",
]

[tool.ruff]
line-length = 100

# Depends()/Form() in argument defaults is FastAPI's documented dependency-injection syntax, not
# the mutable-default bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]
