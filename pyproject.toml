[project]
name = "rainalert"
version = "0.1.0"
description = "Warns about rain starting at your location, from DWD radar nowcast data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyproj>=3.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pydantic[email]>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "wradlib>=2.0",   # test-only oracle for the decoder and grid (D-21) - never imported at runtime
    "ruff>=0.5",
]
# Production only; the local archive store needs no cloud SDK.
gcs = ["google-cloud-storage>=2.16"]

[project.scripts]
rainalert = "rainalert.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rainalert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: compares against wradlib, the reference implementation (D-21)",
]

[tool.ruff]
line-length = 100

# Depends()/Form() in argument defaults is FastAPI's documented dependency-injection syntax, not
# the mutable-default bug B008 exists to catch.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]
